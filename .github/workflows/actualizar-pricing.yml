name: Actualizar precios (pricing Chile)

# Dos formas de correrlo:
#  - Boton "Run workflow" en la pestana Actions de GitHub (workflow_dispatch)
#  - Automatico cada dia a las 12:00 UTC (~08:00 en Chile)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

# Necesario para que la accion pueda commitear el HTML actualizado
permissions:
  contents: write

concurrency:
  group: actualizar-pricing
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capturar precios y regenerar el informe
        run: python3 tools/actualizar_pricing.py

      # El panel historico se versiona aunque el informe no cambie: que un precio
      # siga igual es informacion, y sin este commit la serie se perderia.
      - name: Publicar lo que haya cambiado
        run: |
          ARCHIVOS="pricing_dinamico_chile.html datos/historico_precios.csv tools/historico.json"
          if git diff --quiet -- $ARCHIVOS; then
            echo "Sin cambios: no se commitea nada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $ARCHIVOS
          git commit -m "Actualizar captura de precios ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
