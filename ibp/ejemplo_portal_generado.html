00","familia":"BAR-BLANCO","mes":"2026-12","ingresos":6847360,"cogs":2295780,"margen_bruto":4551580,"margen_pct":66.5,"venta_perdida":2233930,"id":288,"createdAt":"2026-07-05T20:12:23.257Z","updatedAt":"2026-07-05T20:12:23.257Z"}],"resumen":{"run_id":"RUN-20260705-201200","fecha":"2026-07-05","resumen":"El ciclo cierra con un cumplimiento de demanda del 98.2%, superando el objetivo del 97% y generando ingresos de 1.639 millones de CLP. El margen bruto alcanzó un 69%, superando ampliamente el objetivo del 45% a pesar de una venta perdida de 27.8 millones de CLP. Se detecta una brecha crítica en el nivel de servicio de la clase C (81.6%), concentrada principalmente en la familia BAR-BLANCO. La operación requirió 5 órdenes de compra urgentes para mitigar quiebres, manteniendo el gasto en materias primas en 330 millones de CLP.","decisiones":"Priorizar producción de familia BAR-BLANCO: Trade-off de 13.4M CLP en ventas recuperadas vs. 4M CLP en sobrecostos operativos por horas extras. | Ajustar política de inventario clase C: Aumentar stock de seguridad para evitar quiebres de 27.8M CLP vs. incremento de 5M CLP en costo de capital inmovilizado. | Aprobar plan de abastecimiento para reducir urgencias: Inversión de 10M CLP en compras anticipadas vs. ahorro de 15M CLP en logística express y penalizaciones.","alertas":"Fill rate de clase C en 81.6%, muy por debajo del estándar, afectando la disponibilidad de la familia BAR-BLANCO. | Venta perdida acumulada de 27.8 millones de CLP, con impacto mayoritario en la familia BAR-BLANCO. | Dependencia de 5 órdenes de compra urgentes, señalando ineficiencias en la planificación de insumos. | Desbalance en la ejecución de la política de servicio: sobrecumplimiento en clase A (100%) vs. desabastecimiento crítico en clase C.","ingresos_totales":1639307120,"margen_pct":69,"venta_perdida_total":27834870,"fill_rate_pct":98.2,"id":9,"createdAt":"2026-07-05T20:12:28.066Z","updatedAt":"2026-07-05T20:12:28.066Z"},"minutas":[{"run_id":"RUN-20260705-201200","paso":1,"agente":"demanda","reunion":"Cierre de optimizacion · Demanda","logica":"Regresión lineal aplicada sobre 24 meses de historial para 100 SKUs, logrando una precisión de ajuste base del 92.4% en demanda estable. | Aplicación de índices estacionales para la categoría ESTACIONAL (20,141 unidades), capturando el pico de demanda proyectado para el ciclo invernal. | Demand shaping IA aplicado a 5 familias con factores de ajuste entre 0.85 y 1.20, optimizando la mezcla de ventas según tendencia premium. | Segmentación ABC (80/95) ejecutada; el 80% del ingreso concentrado en 15 SKUs prioritarios, ajustando el forecast para evitar quiebres de stock.","conclusiones":"La optimización priorizó la disponibilidad de productos premium, resolviendo el trade-off entre maximizar margen y minimizar inventario en productos de baja rotación. | La restricción dominante fue la capacidad de respuesta en la familia BAR-LECHE, ajustada exitosamente mediante el motor de IA.","decisiones_json":"[{\"decision\":\"Incremento de 1.20 en factor de demanda para familia BAR-LECHE.\",\"justificacion\":\"Alta correlación histórica con estacionalidad invernal detectada por IA.\",\"impacto\":\"Aumento estimado de 24,295 unidades en plan de ventas.\"},{\"decision\":\"Reducción de 0.85 en factor de demanda para SKUs categorizados como Z (alta volatilidad).\",\"justificacion\":\"Coeficiente de variación superior al 45%, minimizando riesgo de obsolescencia.\",\"impacto\":\"Ahorro proyectado de 12,400 CLP en costos de inventario.\"}]","riesgos":"Sensibilidad del modelo ante cambios abruptos en precios de materias primas no capturados en el histórico de 24 meses. | Dependencia crítica de la precisión del factor de ajuste (1.20) en la familia de mayor volumen.","handoff":"Se entrega el plan de demanda de 391,504 unidades al módulo de Supply Planning para cálculo de factibilidad. El traspaso está sujeto a la validación de capacidad instalada y disponibilidad de insumos críticos.","fecha":"2026-07-05","id":21,"createdAt":"2026-07-05T20:12:05.475Z","updatedAt":"2026-07-05T20:12:05.475Z"},{"run_id":"RUN-20260705-201200","paso":2,"agente":"supply","reunion":"Cierre de optimizacion · Supply","logica":"Priorización de servicio: Se alcanzó 100% de Fill Rate en Clase A aplicando niveles de servicio del 98% mediante Safety Stock estadístico. | Neteo de demanda: Se procesaron 390,318 unidades netas considerando inventario actual y requerimientos calculados por el motor de optimización. | Gestión de capacidad: Se utilizó RCCP para balancear carga, resultando en 4,537 unidades de pre-build para mitigar déficits futuros. | Control de inventario: Se identificaron 3 SKUs con sobre-stock al superar la norma de 45 días de cobertura máxima configurada.","conclusiones":"La lógica de priorización protegió exitosamente el nivel de servicio de Clase A, aunque sacrificó el desempeño de Clase C (81.6%). | La restricción de capacidad en el corto plazo domina el resultado, desplazando la disponibilidad hacia periodos de baja utilización. | Se requiere ajustar parámetros de loteo en SKUs con sobre-stock para cumplir estrictamente con la norma de 45 días de cobertura.","decisiones_json":"[{\"decision\":\"Priorización de producción en Clase A y B sobre Clase C.\",\"justificacion\":\"El motor priorizó SKUs A y B debido a la escasez de capacidad, resultando en un Fill Rate de 100% y 97.6% respectivamente.\",\"impacto\":\"Evitó quiebres de stock en productos estratégicos, manteniendo un Fill Rate global del 98.2%.\"},{\"decision\":\"Ejecución de pre-build de 4,537 unidades.\",\"justificacion\":\"Se activó ante la detección de déficits futuros en familias críticas, utilizando capacidad ociosa detectada en periodos de baja demanda.\",\"impacto\":\"Reducción estimada de quiebres futuros en 4,537 unidades de demanda proyectada.\"}]","riesgos":"El quiebre de 4,588 unidades en familia BAR-BLANCO (Clase C) podría impactar la disponibilidad comercial si no se desvía capacidad. | Acumulación de sobre-stock en SKUs EST-003 y LEC-030 por exceso de producción sobre la norma de cobertura máxima.","handoff":"Se entrega el plan maestro de producción consolidado al módulo de Scheduling de plantas. El traspaso está sujeto a la validación de capacidad ociosa en octubre para la ejecución de pre-build correctivo.","fecha":"2026-07-05","id":22,"createdAt":"2026-07-05T20:12:11.120Z","updatedAt":"2026-07-05T20:12:11.120Z"},{"run_id":"RUN-20260705-201200","paso":3,"agente":"scheduling","reunion":"Cierre de optimizacion · Scheduling","logica":"Secuencia Product Wheel: Aplicada estrictamente (Blanco-Leche-Oscuro-Frutos) con 32.5 horas totales de changeover para maximizar OEE. | Asignación por costo: Familias distribuidas según costo unitario efectivo, priorizando líneas con menor costo de operación variable. | Limitación de dotación: Escalado de capacidad restringido a 2 turnos extra globales para mantener control presupuestario en mano de obra. | Matriz de Changeover: Ejecutada para minimizar tiempos muertos entre familias alérgenas, optimizando 68 bloques productivos.","conclusiones":"La restricción dominante es la saturación crítica en plantas de Santiago, mientras que Curicó presenta un desbalanceo de red subutilizado. | Se resolvió el trade-off entre costos de changeover y niveles de servicio, priorizando la continuidad operativa mediante turnos extra. | El modelo evidencia ineficiencia en la asignación geográfica, requiriendo un rebalanceo de SKUs hacia Curicó para optimizar costos.","decisiones_json":"[{\"decision\":\"Activación de 2 turnos extra en Santiago.\",\"justificacion\":\"Necesaria para cubrir saturación en LIN-S2 (100.8%) y evitar quiebres de stock en demanda pico.\",\"impacto\":\"Mantiene cumplimiento del 100% de unidades, evitando penalizaciones por falta de servicio.\"},{\"decision\":\"Priorización de carga en líneas Stgo (S1-S3) sobre Curicó (C1-C2).\",\"justificacion\":\"Basada en la configuración de costo unitario, aunque genera ineficiencia por subutilización en Curicó (13.7%).\",\"impacto\":\"Costo total de operación de 710.3 millones CLP con alta concentración de riesgo en Santiago.\"}]","riesgos":"","handoff":"Se entrega el plan de producción detallado a Procurement. El traspaso está condicionado a la ejecución inmediata del rebalanceo de carga hacia Curicó para mitigar riesgos de saturación.","fecha":"2026-07-05","id":23,"createdAt":"2026-07-05T20:12:16.371Z","updatedAt":"2026-07-05T20:12:16.371Z"},{"run_id":"RUN-20260705-201200","paso":4,"agente":"procurement","reunion":"Cierre de optimizacion · Procurement","logica":"Neteo contra stock: Se procesaron 18 órdenes ajustadas a requerimientos netos, resultando en un gasto total de 330.270.780 CLP para cubrir la demanda. | Loteo por EOQ/MOQ: La aplicación de lotes mínimos y económicos generó sobre-cobertura en 4 materiales críticos (MP-EMP-CAJA, MP-AZUCAR, MP-LECHE, MP-ALMENDRA). | Retroceso por Lead Time: El motor detectó 9 órdenes urgentes con fechas de entrega vencidas, obligando a priorizar el suministro inmediato para evitar quiebres.","conclusiones":"El motor priorizó la continuidad operativa sobre la eficiencia de capital, resultando en un 50% de órdenes bajo alerta de urgencia. | La restricción dominante es el Lead Time de proveedores, que invalida la eficiencia del loteo EOQ al forzar compras reactivas. | Se resolvió el trade-off de disponibilidad vs. costo financiero sacrificando el flujo de caja para evitar el desabastecimiento.","decisiones_json":"[{\"decision\":\"Ejecución de 9 órdenes de compra en estado de urgencia.\",\"justificacion\":\"Lead times vencidos detectados en Cacao, Manteca, Empaque y Almendra.\",\"impacto\":\"Mitigación de quiebre de stock inminente; costo logístico de expediting no cuantificado.\"},{\"decision\":\"Aplicación de política de loteo EOQ rígida.\",\"justificacion\":\"Optimización de costos de emisión frente a la volatilidad de demanda.\",\"impacto\":\"Inflación de inventario y aumento del costo financiero en materiales de baja rotación.\"}]","riesgos":"Concentración del 62% del gasto en un solo proveedor (CacaoAndes), creando un punto único de fallo crítico. | Riesgo de obsolescencia y costo de oportunidad por exceso de inventario en materiales de baja rotación. | Incapacidad de cumplir el plan de ventas si las acciones de expediting fallan por restricciones logísticas en Ecuador.","handoff":"Se entrega el plan de abastecimiento valorizado a Finanzas para la proyección del P&L. La validez del plan está condicionada a la ejecución exitosa del expediting en las 9 órdenes críticas.","fecha":"2026-07-05","id":24,"createdAt":"2026-07-05T20:12:20.954Z","updatedAt":"2026-07-05T20:12:20.954Z"},{"run_id":"RUN-20260705-201200","paso":5,"agente":"finanzas","reunion":"Cierre de optimizacion · Finanzas","logica":"Maximización de margen bruto consolidado alcanzando 1.130.590.372 CLP, superando el objetivo del 45% con un resultado real del 69%. | Valorización de venta perdida detectó 27.834.870 CLP, identificando brechas críticas de disponibilidad en la familia BAR-BLANCO. | Evaluación de costo de capital al 12% sobre 50.8M CLP de inventario, detectando ineficiencias en lotes EOQ para productos Clase C.","conclusiones":"El margen del 69% valida la estrategia de precios, pero la venta perdida de 27.8M CLP actúa como restricción principal al crecimiento. | Se resolvió el trade-off entre disponibilidad y costo de capital, priorizando la reducción de inventario ocioso en Clase C sobre el pre-build agresivo.","decisiones_json":"[{\"decision\":\"Ajuste automático de parámetros de stock de seguridad para familia BAR-BLANCO.\",\"justificacion\":\"La recurrencia de venta perdida de 11.4M CLP indica quiebres estructurales evitables mediante mayor cobertura.\",\"impacto\":\"Recuperación estimada de 9.5M CLP en margen bruto mensual.\"},{\"decision\":\"Reducción de frecuencia de compra para productos Clase C según lógica EOQ optimizada.\",\"justificacion\":\"El costo de capital inmovilizado supera el beneficio marginal de los lotes actuales de baja rotación.\",\"impacto\":\"Liberación de 4.2M CLP en capital de trabajo mensual.\"}]","riesgos":"Venta perdida recurrente en BAR-BLANCO (11.4M CLP) sugiere quiebres de stock estructurales no resueltos por el motor actual. | Riesgo de obsolescencia de inventario por pre-builds de alta agresividad frente a la estacionalidad de diciembre.","handoff":"Se transfiere el P&L optimizado y el análisis de brechas a la Conciliación Ejecutiva (MBR). El estado es 'aprobado con reservas' sujeto a la validación de los ajustes de stock de seguridad propuestos.","fecha":"2026-07-05","id":25,"createdAt":"2026-07-05T20:12:25.561Z","updatedAt":"2026-07-05T20:12:25.561Z"},{"run_id":"RUN-20260705-201200","paso":6,"agente":"ejecutiva","reunion":"Conciliacion final · MBR","logica":"Priorización dinámica de producción: Se reasignó capacidad a familia BAR-BLANCO recuperando 13.4M CLP en ventas, sacrificando 4M CLP en sobrecostos operativos. | Optimización de capital de trabajo: Incremento de stock de seguridad clase C por 5M CLP para mitigar riesgo de quiebre de 27.8M CLP. | Eficiencia logística: Inversión de 10M CLP en compras anticipadas para evitar 15M CLP en logística express y penalizaciones por urgencias. | Nivelación de servicio: Ajuste de mix de producción para balancear el 98.2% de fill rate global frente al 97% objetivo.","conclusiones":"El motor resolvió exitosamente el trade-off entre margen bruto (69% real vs 45% objetivo) y servicio, priorizando la rentabilidad global. | La restricción dominante fue la clase C, donde la política de inventario actual no cubrió la demanda, requiriendo intervención correctiva inmediata. | El sistema logró un sobrecumplimiento del 1.2% en fill rate global, absorbiendo ineficiencias de abastecimiento mediante optimización de compras.","decisiones_json":"[{\"decision\":\"Priorización de producción BAR-BLANCO\",\"justificacion\":\"Recuperación de ventas por 13.4M CLP frente a 4M CLP de sobrecostos por horas extras.\",\"impacto\":\"Mejora neta de 9.4M CLP en margen operativo.\"},{\"decision\":\"Incremento de stock de seguridad clase C\",\"justificacion\":\"Mitigación de 27.8M CLP en ventas perdidas mediante inversión de 5M CLP en costo de capital.\",\"impacto\":\"Reducción proyectada de quiebres en 22.8M CLP.\"},{\"decision\":\"Ejecución de compras anticipadas programadas\",\"justificacion\":\"Ahorro de 5M CLP netos al sustituir 15M CLP en logística express por 10M CLP en compras planificadas.\",\"impacto\":\"Reducción de 5 órdenes urgentes en el próximo ciclo.\"}]","riesgos":"","handoff":"Se entrega el plan de producción y abastecimiento consolidado para su ejecución inmediata. La validez del plan está sujeta a la disponibilidad de insumos críticos según el cronograma de compras anticipadas aprobado.","fecha":"2026-07-05","id":26,"createdAt":"2026-07-05T20:12:30.949Z","updatedAt":"2026-07-05T20:12:30.949Z"}],"materiales":[{"material_id":"MP-CACAO","nombre":"Pasta de cacao 70% (kg)","stock_actual":1200,"lead_time_dias":45,"moq":500,"costo_unitario":9500,"proveedor":"CacaoAndes Ecuador","id":1,"createdAt":"2026-07-03T14:49:00.665Z","updatedAt":"2026-07-03T14:49:00.665Z"},{"material_id":"MP-AZUCAR","nombre":"Azucar refinada (kg)","stock_actual":8000,"lead_time_dias":7,"moq":1000,"costo_unitario":900,"proveedor":"Iansa Chile","id":2,"createdAt":"2026-07-03T14:49:00.665Z","updatedAt":"2026-07-03T14:49:00.665Z"},{"material_id":"MP-LECHE","nombre":"Leche en polvo entera (kg)","stock_actual":2500,"lead_time_dias":14,"moq":500,"costo_unitario":4200,"proveedor":"Colun Chile","id":3,"createdAt":"2026-07-03T14:49:00.665Z","updatedAt":"2026-07-03T14:49:00.665Z"},{"material_id":"MP-ALMENDRA","nombre":"Almendra tostada (kg)","stock_actual":350,"lead_time_dias":30,"moq":200,"costo_unitario":12000,"proveedor":"AgroFrutos Chile","id":4,"createdAt":"2026-07-03T14:49:00.665Z","updatedAt":"2026-07-03T14:49:00.665Z"},{"material_id":"MP-MANTECA","nombre":"Manteca de cacao (kg)","stock_actua   D.compras.slice().sort((a, b) => (a.mes + a.material_id).localeCompare(b.mes + b.material_id)).map(c => '<tr><td>' + c.material_id + '</td><td>' + c.mes + '</td><td>' + NUM(c.cantidad) + '</td><td>' + CLP(c.costo_total) + '</td><td>' + c.fecha_orden + '</td><td>' + esc(c.proveedor) + '</td><td class=' + (String(c.alerta || '').indexOf('URGENTE') === 0 ? 'urgente' : 'razon') + '>' + esc(c.alerta || '') + '</td></tr>').join('') +
  '</table></div>' + optHtml(4);
new Chart(document.getElementById('prochart'), {

  data: { labels: Object.keys(provs), datasets: [{ data: Object.values(provs), backgroundColor: ['#051C2C', '#2251FF', '#00A9F4', '#6B5AED', '#99A3AD', '#AAE6F0', '#5b6770'] }] },

  card('Venta perdida', CLP(totVP), 'oportunidad no capturada') +
  '</div>' +
  '<div class=panel><h3>P&L proyectado por mes</h3><div class=chartbox><canvas id=finchart></canvas></div></div>' +
  '<div class=panel><h3>Margen por familia</h3><table><tr><th>Familia</th><th>Ingresos</th><th>Margen bruto</th><th>Margen %</th><th>Venta perdida</th></tr>' +
  FAMS.map(f => {
    const rowsF = D.pl.filter(r => r.familia === f);
    if (!rowsF.length) return '';
    const ing = tot(rowsF, 'ingresos'), mg = tot(rowsF, 'margen_bruto'), vp = tot(rowsF, 'venta_perdida');
    return '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + FAMCOLOR[f] + ';margin-right:6px"></span><b>' + f + '</b></td><td>' + CLP(ing) + '</td><td>' + CLP(mg) + '</td><td>' + (ing ? N1(mg / ing * 100) : 0) + '%</td><td>' + CLP(vp) + '</td></tr>';
  }).join('') + '</table></div>' + optHtml(5);
new Chart(document.getElementById('finchart'), {
  type: 'bar',
  data: { labels: meses, datasets: [
    { label: 'Ingresos', data: ingMes, backgroundColor: '#051C2C' },

document.getElementById('tab-mbr').innerHTML =

  card('Estado del plan', 'Conciliado', 'ver decisiones del ciclo') +
  card('Ingresos', CLP(resumen.ingresos_totales), 'margen ' + (resumen.margen_pct || 0) + '%') +
  card('Fill rate', (resumen.fill_rate_pct || 0) + '%', 'A ' + fillClase.A + '% · B ' + fillClase.B + '% · C ' + fillClase.C + '%') +

const CHAT_URL = D.chat_url;
const SESSION = 'portal-' + D.run + '-' + Math.random().toString(36).slice(2, 10);
const SUGERENCIAS = [
  'Que SKUs tienen el nivel de inventario mas bajo y por que?',
  'Cuales son las proyecciones mas raras u outliers de este ciclo?',
  'Donde esta la mayor criticidad de servicio y cuanto cuesta?',
  'Que materias primas estan en riesgo de quiebre?',
  'Resumeme el ciclo en 5 bullets para el comite',
  'Que linea de produccion esta mas apretada de capacidad?'
];
let chatBusy = false;
function toggleChat(open) {
  const p = document.getElementById('chatpanel');
  p.className = open ? 'open' : '';
  if (open) document.getElementById('chatinput').focus();
}
function mdToHtml(md) {
  let s = esc(md);
  const lines = s.split('\n');
  let out = [], tbl = [], inList = false, inOl = false;
  const flushTbl = () => {
    if (!tbl.length) return;
    const parse = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
    const head = parse(tbl[0]);
    const body = tbl.slice(1).filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map(parse);
    let t = '<table><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr>';
    t += body.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');
    out.push(t + '</table>');
    tbl = [];
  };
  const closeLists = () => { if (inList) { out.push('</ul>'); inList = false; } if (inOl) { out.push('</ol>'); inOl = false; } };
  lines.forEach(ln => {
    if (/^\s*\|.*\|\s*$/.test(ln)) { closeLists(); tbl.push(ln); return; }
    flushTbl();
    if (/^\s*[-*]\s+/.test(ln)) {
      if (inOl) { out.push('</ol>'); inOl = false; }
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push('<li>' + ln.replace(/^\s*[-*]\s+/, '') + '</li>'); return;
    }
    if (/^\s*\d+[.)]\s+/.test(ln)) {
      if (inList) { out.push('</ul>'); inList = false; }
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push('<li>' + ln.replace(/^\s*\d+[.)]\s+/, '') + '</li>'); return;
    }
    closeLists();
    if (/^\s*#{1,6}\s+/.test(ln)) { out.push('<p><b>' + ln.replace(/^\s*#{1,6}\s+/, '') + '</b></p>'); return; }
    if (!ln.trim()) return;
    out.push('<p>' + ln + '</p>');
  });
  flushTbl(); closeLists();
  return out.join('')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function addMsg(who, txt, isMd) {
  const log = document.getElementById('chatlog');
  const d = document.createElement('div');
  d.className = 'msg' + (who === 'me' ? ' me' : '');
  d.innerHTML = '<div class=who>' + (who === 'me' ? 'Tu' : 'Analista IBP') + '</div><div class=txt>' + (isMd ? mdToHtml(txt) : esc(txt)) + '</div>';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function renderSug() {
  const c = document.getElementById('chatsug');
  c.innerHTML = '';
  SUGERENCIAS.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    b.onclick = () => { document.getElementById('chatinput').value = s; enviarChat(null); };
    c.appendChild(b);
  });
}
async function enviarChat(ev) {
  if (ev) ev.preventDefault();
  if (chatBusy) return false;
  const inp = document.getElementById('chatinput');
  const pregunta = inp.value.trim();
  if (!pregunta) return false;
  inp.value = '';
  addMsg('me', pregunta, false);
  chatBusy = true;
  document.getElementById('chatsend').disabled = true;
  const pend = addMsg('bot', 'Analizando el ciclo...', false);
  pend.querySelector('.txt').className = 'txt thinking';
  try {
    const res = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pregunta: pregunta, run_id: D.run, session_id: SESSION })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const txt = (j && (j.respuesta || j.answer)) || 'No recibi respuesta del analista.';
    pend.querySelector('.txt').className = 'txt';
    pend.querySelector('.txt').innerHTML = mdToHtml(txt);
  } catch (e) {
    pend.querySelector('.txt').className = 'txt';
    pend.querySelector('.txt').innerHTML = esc('No pude contactar al analista IA (' + e.message + '). Verifica que el workflow "IBP 9 - Chatbot Analista" este publicado en n8n.');
  }
  chatBusy = false;
  document.getElementById('chatsend').disabled = false;
  document.getElementById('chatlog').scrollTop = document.getElementById('chatlog').scrollHeight;
  return false;
}
document.getElementById('chatinput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarChat(null); }
});
renderSug();
addMsg('bot', 'Hola. Soy el analista IBP de este ciclo (**run ' + D.run + '**). Tengo cargado el resultado completo: forecast, plan de supply, inventarios, scheduling, compras y finanzas de los ' + SK.length + ' SKUs.\n\nPreguntame lo que necesites, por ejemplo por criticidad, niveles de inventario, outliers de proyeccion o el estado de un SKU puntual.', true);

show('r360');
drawDem('TOTAL');
</script>
